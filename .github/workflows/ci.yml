name: CI

on:
  push:
    branches: [ "principal", "main" ]
  pull_request:
    branches: [ "principal", "main" ]

jobs:
  check-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar estrutura básica
        run: |
          test -f README.md
          test -f docs/proposta-inicial.md
          test -f docs/pesquisa/validacao-problema.md
          test -f docs/requisitos/requisitos-funcionais.md
          test -f docs/requisitos/requisitos-nao-funcionais.md
          test -f backend/app/main.py
          test -f frontend/src/app/page.tsx
          test -f frontend/package-lock.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - run: ruff check app tests
      - run: mypy app
      - run: python -m compileall app
