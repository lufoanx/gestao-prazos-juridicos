name: CI

on:
  push:
    branches: [ "principal", "main" ]
  pull_request:
    branches: [ "principal", "main", "feature/backend-foundation" ]

jobs:
  check-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar estrutura básica
        run: |
          test -f README.md
          test -f docs/proposta-inicial.md
          test -f docs/pesquisa/validacao-problema.md
          test -f docs/requisitos/requisitos-funcionais.md
          test -f docs/requisitos/requisitos-nao-funcionais.md
          test -f backend/app/main.py
          test -f frontend/src/app/page.tsx
          test -f frontend/package-lock.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - run: ruff check app tests
      - run: mypy app
      - run: python -m compileall app

  # Etapa 6.1: integração REAL BFF ↔ FastAPI e E2E no navegador (Next em modo integrado).
  integration:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Integração real (BFF + FastAPI)
        run: npm run test:integration
        working-directory: frontend
        env:
          PRAZOAI_TEST_PYTHON: python
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: E2E (navegador + Next integrado + FastAPI)
        run: npm run test:e2e
        working-directory: frontend
        env:
          PRAZOAI_TEST_PYTHON: python
