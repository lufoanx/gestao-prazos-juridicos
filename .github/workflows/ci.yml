name: CI

on:
  push:
    branches: [ "principal", "main" ]
  pull_request:
    branches: [ "principal", "main", "feature/backend-foundation" ]

# PostgreSQL dos testes: contêineres DESCARTÁVEIS só deste CI. A senha não fica no repositório: é gerada por
# execução e chega aos clientes por PGPASSWORD (libpq/psycopg e node-postgres a leem quando a URL não tem senha).
env:
  PGPASSWORD: ${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}

jobs:
  check-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar estrutura básica
        run: |
          test -f README.md
          test -f docs/proposta-inicial.md
          test -f docs/pesquisa/validacao-problema.md
          test -f docs/requisitos/requisitos-funcionais.md
          test -f docs/requisitos/requisitos-nao-funcionais.md
          test -f backend/app/main.py
          test -f frontend/src/app/page.tsx
          test -f frontend/package-lock.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # Doc 27: PostgreSQL descartável para o armazenamento COMPARTILHADO das sessões do BFF (contrato,
    # repouso cifrado, reinício e várias instâncias). Senha só deste serviço.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prazoai
          POSTGRES_PASSWORD: ${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_DB: prazoai_bff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prazoai -d prazoai_bff_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          PRAZOAI_TEST_BFF_DATABASE_URL: postgresql://prazoai@localhost:5432/prazoai_bff_test
          PRAZOAI_REQUIRE_BFF_PG_TESTS: "1"
      - name: Esquema das sessões do BFF pela linha de comando (check → migrate com confirmação → check)
        env:
          PRAZOAI_BFF_DATABASE_URL: postgresql://prazoai@localhost:5432/prazoai_bff_test
        run: |
          psql "postgresql://prazoai@localhost:5432/prazoai_bff_test" -c "DROP SCHEMA IF EXISTS prazoai_bff CASCADE"
          set +e; npm run --silent bff:sessions -- check; code=$?; set -e
          test "$code" = "4"                                   # ausente
          set +e; npm run --silent bff:sessions -- migrate; code=$?; set -e
          test "$code" = "2"                                   # sem confirmação do destino
          PRAZOAI_BFF_CONFIRM_TARGET=localhost:5432/prazoai_bff_test npm run --silent bff:sessions -- migrate
          npm run --silent bff:sessions -- check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # P1 (persistência): PostgreSQL 16 REAL e descartável para os testes de fundação.
    # A aplicação continua em memória; o banco é usado só pelos testes e pelos comandos de migration.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prazoai
          POSTGRES_PASSWORD: ${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_DB: prazoai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prazoai -d prazoai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # E3 (doc 21): capturador SMTP LOCAL e descartável (Mailpit, imagem oficial, versão FIXADA).
      # Sem relay configurado (nada sai do capturador); usado só pelos testes de integração da E3.
      # A prontidão é verificada pela fixture (`/readyz`), sem healthcheck dependente da imagem.
      mailpit:
        image: axllent/mailpit:v1.31.6
        env:
          MP_DISABLE_VERSION_CHECK: "true"
          MP_MAX_MESSAGES: "500"
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      # Versões travadas com hash (requirements-dev.lock) e só pacotes binários: nenhum script de instalação roda.
      - run: |
          python -m pip install --only-binary :all: --require-hashes -r requirements-dev.lock
      # Doc 27: PostgreSQL DESCARTÁVEL com TLS (certificado autoassinado gerado aqui) para os testes que
      # sobem a aplicação real em staging/production (exigem sslmode). Nenhum dado real; só loopback.
      - name: PostgreSQL com TLS para os testes de ambiente hospedado
        run: |
          mkdir -p /tmp/pgtls && cd /tmp/pgtls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.crt -days 2 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          sudo chown 999:999 server.key server.crt && sudo chmod 600 server.key
          docker run -d --name pgtls -p 127.0.0.1:5433:5432 -v /tmp/pgtls:/tls:ro \
            -e POSTGRES_USER=prazoai -e POSTGRES_PASSWORD="$PGPASSWORD" -e POSTGRES_DB=prazoai_test_hosted \
            postgres:16 -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
          for i in $(seq 1 60); do docker exec pgtls pg_isready -U prazoai -d prazoai_test_hosted && break; sleep 1; done
      # Doc 28: Azure Blob LOCAL (Azurite, pacote oficial com versão FIXADA) só em 127.0.0.1. Sem conta real.
      # --skipApiVersionCheck: o SDK fixado usa uma versão de API mais nova que a do emulador.
      - name: Azure Blob local (Azurite 3.37.0 em 127.0.0.1)
        run: |
          npm install --ignore-scripts --no-save --no-audit --no-fund --prefix /tmp/azurite azurite@3.37.0
          nohup /tmp/azurite/node_modules/.bin/azurite-blob --blobHost 127.0.0.1 --blobPort 10000 \
            --location /tmp/azurite-data --skipApiVersionCheck --silent > /tmp/azurite.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:10000/devstoreaccount1?comp=list' || true)
            [ "$code" = "403" ] && echo "Azurite pronto" && break
            sleep 0.5
          done
          [ "$code" = "403" ]
      - name: pytest (inclui PostgreSQL real e a E3 contra o capturador; falha se algum não estiver configurado)
        run: pytest
        env:
          PRAZOAI_TEST_HOSTED_DATABASE_URL: postgresql+psycopg://prazoai@127.0.0.1:5433/prazoai_test_hosted?sslmode=require
          PRAZOAI_REQUIRE_HOSTED_TESTS: "1"
          # Chave PÚBLICA e documentada do emulador Azurite (não é segredo; conta devstoreaccount1).
          PRAZOAI_TEST_AZURITE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
          PRAZOAI_REQUIRE_AZURITE_TESTS: "1"
          ENVIRONMENT: test
          TEST_DATABASE_URL: postgresql+psycopg://prazoai@localhost:5432/prazoai_test
          PRAZOAI_REQUIRE_POSTGRES_TESTS: "1"
          PRAZOAI_TEST_MAILPIT_SMTP: 127.0.0.1:1025
          PRAZOAI_TEST_MAILPIT_API: http://127.0.0.1:8025
          PRAZOAI_REQUIRE_MAILPIT_TESTS: "1"
      - name: Suítes HTTP em STORAGE=postgres (autenticação e domínio contra PostgreSQL real)
        run: >-
          pytest -p no:cacheprovider -rs
          tests/test_auth_cost_protection.py tests/test_auth_password_reset.py tests/test_auth_refresh.py
          tests/test_auth_register_login.py tests/test_auth_tokens.py tests/test_users_me.py tests/test_auth_google.py
          tests/test_org_*.py tests/test_deadline*.py tests/test_intimation*.py tests/test_notification*.py
          tests/test_storage_effective.py
        env:
          ENVIRONMENT: test
          TEST_DATABASE_URL: postgresql+psycopg://prazoai@localhost:5432/prazoai_test
          PRAZOAI_REQUIRE_POSTGRES_TESTS: "1"
          PRAZOAI_TEST_STORAGE: postgres
          PRAZOAI_TEST_AZURITE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
          PRAZOAI_REQUIRE_AZURITE_TESTS: "1"
      - name: Migrations pela linha de comando (vazio → head; 0004 → 0003 → 0002 → 0001 → head; base → head; banco separado)
        env:
          DATABASE_URL: postgresql+psycopg://prazoai@localhost:5432/prazoai_ci_migrations
        run: |
          psql -h localhost -U prazoai -d prazoai_test -c "CREATE DATABASE prazoai_ci_migrations"
          python -m app.db check
          alembic upgrade head
          test "$(alembic current 2>/dev/null)" = "0004 (head)"
          alembic downgrade 0003
          test "$(alembic current 2>/dev/null)" = "0003"
          alembic downgrade 0002
          test "$(alembic current 2>/dev/null)" = "0002"
          alembic downgrade 0001
          test "$(alembic current 2>/dev/null)" = "0001"
          alembic upgrade head
          alembic downgrade base
          test -z "$(alembic current 2>/dev/null)"
          alembic upgrade head
          test "$(alembic current 2>/dev/null)" = "0004 (head)"
      - name: Prova do comando de manutenção (banco descartável do CI; nunca banco real)
        env:
          ENVIRONMENT: test
          STORAGE: postgres
          DATABASE_URL: postgresql+psycopg://prazoai@localhost:5432/prazoai_ci_migrations
        run: |
          set +e
          python -m app.maintenance purge --batch-size 50 > purge.json; code=$?
          set -e
          cat purge.json
          test "$code" = "0"
          python -c "import json; d=json.load(open('purge.json')); assert d['status']=='ok' and not d['interrupted'], d"
          alembic downgrade 0002
          set +e
          python -m app.maintenance purge > purge-schema.json; code=$?
          set -e
          cat purge-schema.json
          test "$code" = "4"                       # esquema desatualizado: recusa sem apagar
          alembic upgrade head
          set +e
          STORAGE=memory python -m app.maintenance purge > /dev/null; code=$?
          set -e
          test "$code" = "3"                       # memória: não finge limpar outro processo
      - run: ruff check app tests migrations
      - run: mypy --no-incremental app
      - run: python -m compileall app migrations

  # Doc 27: as imagens são CONSTRUÍDAS e exercitadas localmente no runner; nada é publicado (sem login
  # em registro, sem push). Backend: sobe em development, recusa production incompleta, usuário não-root.
  # Frontend: build demo (padrão) e integrado; a demo serve páginas sem BFF.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem do backend
        run: docker build -t prazoai-backend:ci backend
      - name: Imagem do backend — execução, recusa de produção incompleta e usuário
        run: |
          test "$(docker run --rm prazoai-backend:ci id -u)" != "0"
          docker run -d --name api -p 127.0.0.1:18000:8000 -e ENVIRONMENT=development prazoai-backend:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18000/api/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:18000/api/v1/health/ready
          docker rm -f api
          set +e
          docker run --rm -e ENVIRONMENT=production prazoai-backend:ci > prod.log 2>&1; code=$?
          set -e
          test "$code" != "0"
          grep -q "HostedConfigError" prod.log
      - name: Build da imagem do frontend (demo, padrão)
        run: docker build -t prazoai-frontend:demo frontend
      - name: Imagem do frontend (demo) — páginas servidas e BFF desligado
        run: |
          test "$(docker run --rm prazoai-frontend:demo id -u)" != "0"
          docker run -d --name web -p 127.0.0.1:13000:3000 prazoai-frontend:demo
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:13000/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13000/login)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13000/bff/health)" = "404"
          docker rm -f web
      - name: Build da imagem do frontend (integrado)
        run: docker build --build-arg NEXT_PUBLIC_PRAZOAI_MODE=integrated -t prazoai-frontend:integrated frontend

  # Etapa 6.1: integração REAL BFF ↔ FastAPI e E2E no navegador (Next em modo integrado).
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Imagem oficial com browsers e dependências: evita apt install no runner.
    # Manter esta versão igual a @playwright/test no package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    needs: [frontend, backend]
    # PostgreSQL descartável do CI (senha só deste serviço). No job em contêiner, o host é "postgres".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prazoai
          POSTGRES_PASSWORD: ${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_DB: prazoai_integ
        options: >-
          --health-cmd "pg_isready -U prazoai" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Sem cache pip neste contêiner: o cache da action exige lsb_release.
      - run: |
          python -m pip install --only-binary :all: --require-hashes -r backend/requirements-dev.lock
      - name: Preparar bancos da integração e do E2E (migrations explícitas)
        working-directory: backend
        env:
          ADMIN_URL: postgresql://prazoai@postgres:5432/prazoai_integ
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["ADMIN_URL"], autocommit=True) as conn:
              conn.execute("CREATE DATABASE prazoai_e2e")
              conn.execute("CREATE DATABASE prazoai_bff_test")      # sessões do BFF (integração; doc 27)
              conn.execute("CREATE DATABASE prazoai_bff_e2e_test")  # sessões do BFF (E2E; doc 27)
              conn.execute("CREATE DATABASE prazoai_files_integ_test")  # PDF das intimações (integração; doc 28)
          PY
          for db in prazoai_integ prazoai_e2e; do
            DATABASE_URL="postgresql+psycopg://prazoai@postgres:5432/$db" alembic upgrade head
            test "$(DATABASE_URL="postgresql+psycopg://prazoai@postgres:5432/$db" alembic current 2>/dev/null)" = "0004 (head)"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      # E4 (doc 21): o capturador da E3 em LOOPBACK dentro deste job. O job roda no contêiner do Playwright,
      # onde um serviço só seria alcançável por nome de host — e o backend só aceita SMTP sem TLS em
      # loopback (regra da E1, não afrouxada). Mesmo software e versão do serviço do job `backend`
      # (Mailpit v1.31.6), binário oficial da release com SHA-256 conferido; sem relay; só 127.0.0.1.
      - name: Capturador SMTP local (Mailpit v1.31.6 em 127.0.0.1, binário oficial verificado)
        run: |
          python - <<'PY'
          import hashlib, tarfile, urllib.request
          url = "https://github.com/axllent/mailpit/releases/download/v1.31.6/mailpit-linux-amd64.tar.gz"
          expected = "10fa12ccc610f653d4ed4df848c1817f9935dcf4e9a6a458a19ab0fa02093f91"
          data = urllib.request.urlopen(url, timeout=60).read()
          digest = hashlib.sha256(data).hexdigest()
          if digest != expected:
              raise SystemExit(f"SHA-256 inesperado do Mailpit: {digest}")
          open("/tmp/mailpit.tgz", "wb").write(data)
          with tarfile.open("/tmp/mailpit.tgz") as tar:
              tar.extract("mailpit", "/tmp/mailpit-bin", filter="data")
          PY
          nohup /tmp/mailpit-bin/mailpit --listen 127.0.0.1:8025 --smtp 127.0.0.1:1025 --disable-version-check \
            > /tmp/mailpit.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  if urllib.request.urlopen("http://127.0.0.1:8025/readyz", timeout=2).status == 200:
                      print("capturador pronto"); break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit("capturador não respondeu")
          PY
      # Doc 28: Azurite em LOOPBACK dentro deste job (o contêiner do Playwright só alcançaria um serviço por
      # nome de host). Versão FIXADA do pacote oficial; só o serviço blob; dados em diretório temporário.
      - name: Azure Blob local (Azurite 3.37.0 em 127.0.0.1)
        run: |
          npm install --ignore-scripts --no-save --no-audit --no-fund --prefix /tmp/azurite azurite@3.37.0
          nohup /tmp/azurite/node_modules/.bin/azurite-blob --blobHost 127.0.0.1 --blobPort 10000 \
            --location /tmp/azurite-data --skipApiVersionCheck --silent > /tmp/azurite.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(python -c "import urllib.request,urllib.error
          try: urllib.request.urlopen('http://127.0.0.1:10000/devstoreaccount1?comp=list', timeout=2)
          except urllib.error.HTTPError as e: print(e.code)
          except OSError: print(0)")
            [ "$code" = "403" ] && echo "Azurite pronto" && break
            sleep 0.5
          done
          [ "$code" = "403" ]
      - name: Integração real (BFF + FastAPI, STORAGE=memory)
        run: npm run test:integration
        working-directory: frontend
        env:
          PRAZOAI_TEST_PYTHON: python
          PRAZOAI_TEST_BFF_DATABASE_URL: postgresql://prazoai@postgres:5432/prazoai_bff_test
          PRAZOAI_REQUIRE_BFF_PG_TESTS: "1"
          # Doc 27, §6: papéis separados com privilégios mínimos (banco e papéis temporários criados e removidos).
          PRAZOAI_TEST_PG_ADMIN_URL: postgresql://prazoai@postgres:5432/postgres
          PRAZOAI_REQUIRE_PRIVILEGE_TESTS: "1"
          # Doc 28: PDF das intimações (FastAPI em PostgreSQL próprio + Azurite local)
          PRAZOAI_TEST_FILES_DATABASE_URL: postgresql+psycopg://prazoai@postgres:5432/prazoai_files_integ_test
          PRAZOAI_TEST_AZURITE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
          PRAZOAI_REQUIRE_FILES_TESTS: "1"
          PRAZOAI_TEST_MAILPIT_SMTP: 127.0.0.1:1025
          PRAZOAI_TEST_MAILPIT_API: http://127.0.0.1:8025
          PRAZOAI_REQUIRE_MAILPIT_TESTS: "1"
      - name: Verificar armazenamento efetivo do backend (falha se não subir em postgres)
        working-directory: backend
        env:
          ENVIRONMENT: test
          AUTH_JWT_SECRET: ci-verificacao-de-armazenamento-0123456789abcdef0123456789
          STORAGE: postgres
          DATABASE_URL: postgresql+psycopg://prazoai@postgres:5432/prazoai_integ
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 --no-proxy-headers &
          PID=$!
          python - <<'PY'
          import json, time, urllib.request
          for _ in range(60):
              try:
                  body = json.load(urllib.request.urlopen("http://127.0.0.1:8765/api/v1/health"))
                  break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit("backend não respondeu")
          assert body.get("storage") == "postgres" and body.get("durable") is True, body
          print("armazenamento efetivo:", body)
          PY
          kill $PID
      - name: Integração real (BFF + FastAPI, STORAGE=postgres)
        run: npm run test:integration
        working-directory: frontend
        env:
          PRAZOAI_TEST_PYTHON: python
          PRAZOAI_TEST_BFF_DATABASE_URL: postgresql://prazoai@postgres:5432/prazoai_bff_test
          PRAZOAI_REQUIRE_BFF_PG_TESTS: "1"
          # Doc 27, §6: papéis separados com privilégios mínimos (banco e papéis temporários criados e removidos).
          PRAZOAI_TEST_PG_ADMIN_URL: postgresql://prazoai@postgres:5432/postgres
          PRAZOAI_REQUIRE_PRIVILEGE_TESTS: "1"
          # Doc 28: PDF das intimações (FastAPI em PostgreSQL próprio + Azurite local)
          PRAZOAI_TEST_FILES_DATABASE_URL: postgresql+psycopg://prazoai@postgres:5432/prazoai_files_integ_test
          PRAZOAI_TEST_AZURITE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
          PRAZOAI_REQUIRE_FILES_TESTS: "1"
          STORAGE: postgres
          DATABASE_URL: postgresql+psycopg://prazoai@postgres:5432/prazoai_integ
          PRAZOAI_TEST_MAILPIT_SMTP: 127.0.0.1:1025
          PRAZOAI_TEST_MAILPIT_API: http://127.0.0.1:8025
          PRAZOAI_REQUIRE_MAILPIT_TESTS: "1"
      - name: Confirmar dados persistidos pela integração no PostgreSQL
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://prazoai@postgres:5432/prazoai_integ") as c:
              n = {t: c.execute(f"SELECT count(*) FROM prazoai.{t}").fetchone()[0]
                   for t in ("users", "auth_sessions", "offices", "deadlines", "intimations")}
          print(n)
          assert all(v > 0 for v in n.values()), n
          PY
      - name: Verificar Chromium preinstalado e versão do Playwright
        working-directory: frontend
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const { version } = require('@playwright/test/package.json');
          if (version !== '1.64.1') throw new Error('Atualize a imagem do CI para a versão instalada do Playwright');
          (async () => {
            const browser = await chromium.launch();
            console.log(`Playwright ${version}; Chromium ${browser.version()}`);
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: E2E completo numa única execução (navegador + Next integrado + FastAPI em STORAGE=postgres + Mailpit local)
        run: npm run test:e2e
        working-directory: frontend
        env:
          PRAZOAI_TEST_PYTHON: python
          # Doc 27: sessões do BFF no PostgreSQL (esquema recriado pelo global-setup; banco descartável).
          PRAZOAI_E2E_BFF_DATABASE_URL: postgresql://prazoai@postgres:5432/prazoai_bff_e2e_test
          # Doc 28: PDF das intimações no Azurite local (container próprio criado pelo global-setup).
          PRAZOAI_E2E_AZURITE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
          PRAZOAI_REQUIRE_BFF_PG_TESTS: "1"
          STORAGE: postgres
          DATABASE_URL: postgresql+psycopg://prazoai@postgres:5432/prazoai_e2e
          # E5: recuperação de senha real no navegador; o capturador do passo anterior (só loopback).
          PRAZOAI_TEST_MAILPIT_SMTP: 127.0.0.1:1025
          PRAZOAI_TEST_MAILPIT_API: http://127.0.0.1:8025
          PRAZOAI_REQUIRE_MAILPIT_TESTS: "1"
      - name: Confirmar dados persistidos pelo E2E no PostgreSQL
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://prazoai@postgres:5432/prazoai_e2e") as c:
              n = {t: c.execute(f"SELECT count(*) FROM prazoai.{t}").fetchone()[0]
                   for t in ("users", "auth_sessions", "offices", "deadlines", "intimations", "notifications")}
          print(n)
          assert all(v > 0 for v in n.values()), n
          PY

  # Imagens de produção (GHCR): só num push para main e só depois de TODOS os jobs acima passarem.
  # Chama o workflow reutilizável — o código publicado é exatamente o commit testado aqui.
  publicar:
    needs: [check-structure, frontend, backend, docker, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publicar-imagens.yml
