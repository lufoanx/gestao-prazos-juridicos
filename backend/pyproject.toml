[project]
name = "prazoai-backend"
version = "0.1.0"
description = "Fundação do backend do PrazoAI (FastAPI, sem banco de dados)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["(^|/)\\.venv/", "(^|/)tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
